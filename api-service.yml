server:
  port: 8085

spring:
  application:
    name: api-service

  cloud:
    gateway:
      routes:
        - id: inventory
          uri: lb://inventory-service
          predicates:
            - Path=/tools/**
          filters:
            - StripPrefix= 1
        - id: loan
          uri: lb://loan-service
          predicates:
            - Path=/loans/**
          filters:
            - StripPrefix= 1
        - id: client
          uri: lb://client-service
          predicates:
            - Path=/api/v1/clients/**
          filters:
            - StripPrefix= 1
        - id: report
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**
          filters:
            - StripPrefix= 1
        - id: fine
          uri: lb://fine-service
          predicates:
            - Path=/fines/**
          filters:
            - StripPrefix= 1
      default-filters:
        - RemoveRequestHeader=Cookie
      httpclient:
        connect-timeout: 5000
        response-timeout: 5000

      # 👇 Configuración global de CORS
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

    loadbalancer:
      retry:
        enabled: true
    discovery:
      locator:
        enabled: true
        lower-case-service-id: true

eureka:
  client:
    instance:
      prefer-ip-address: true
      lease-renewal-interval-in-seconds: 30
      lease-expiration-duration-in-seconds: 90
      instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    service-url:
      fetch-registry: true
      register-with-eureka: true
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
